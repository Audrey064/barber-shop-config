server.port=8880

eureka.client.service-url.defaultZone=http://localhost:8889/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


spring.cloud.gateway.server.webflux.discovery.locator.enabled=true

spring.cloud.gateway.server.webflux.routes[0].id=shop-authentification-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://shop-authentification-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=${AUTH_SERVICE_PATH}

spring.cloud.gateway.server.webflux.routes[1].id=shop-catalog-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://shop-catalog-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=${CATEGORY_SERVICE_PATH}
spring.cloud.gateway.server.webflux.routes[1].predicates[1]=${OFFER_SERVICE_PATH}


# Constants for Path Predicates
AUTH_SERVICE_PATH= /api/v1/authentification/**  # Path for Auth Service - Auth operation
USER_SERVICE_PATH= /api/v1/user/**  # Path for User Service - User operation
CATEGORY_SERVICE_PATH= /api/v1/category/**  # Path for User Service - User operation
OFFER_SERVICE_PATH= /api/v1/offer/**  # Path for User Service - User operation