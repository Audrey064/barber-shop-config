server.port=8880

eureka.client.service-url.defaultZone=http://localhost:8889/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


spring.cloud.gateway.discovery.locator.enabled=true

spring.cloud.gateway.routes[0].id=shop-authentification-service
spring.cloud.gateway.routes[0].uri=lb://shop-authentification-service
spring.cloud.gateway.routes[0].predicates[0]=Path=${AUTH_SERVICE_PATH}

spring.cloud.gateway.routes[1].id=shop-catalog-service
spring.cloud.gateway.routes[1].uri=lb://shop-catalog-service
spring.cloud.gateway.routes[1].predicates[0]=Path=${CATEGORY_SERVICE_PATH},${OFFER_SERVICE_PATH}
spring.main.web-application-type= reactive

# Constants for Path Predicates
AUTH_SERVICE_PATH= /api/v1/authentication/**
USER_SERVICE_PATH= /api/v1/user/**
CATEGORY_SERVICE_PATH= /api/v1/category/**
OFFER_SERVICE_PATH= /api/v1/offer/**